name: Echo
options:
  bundleIdPrefix: com.irenapoghosyan
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: G6AA4T82BJ

targets:
  Echo:
    type: application
    platform: iOS
    sources: [Echo]
    info:
      path: Echo/Info.plist
      properties:
        CFBundleDisplayName: Echo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The whole UI is built in code; the scene delegate creates the window.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenapoghosyan.echo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  EchoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EchoTests]
    dependencies:
      - target: Echo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Echo:
    build:
      targets:
        Echo: all
        EchoTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets: [Echo]
      targets: [EchoTests]
